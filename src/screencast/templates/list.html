<!doctype html><meta charset="utf-8">
<style>$theme</style>
<style>$base</style>
<style>
/* A spoken enumeration point. Louder than a chapter overlay on purpose: this IS the
 * subject of the moment, where a chapter title is only a signpost. The picture behind it
 * is blurred and dimmed by ffmpeg, not here — a CSS backdrop-filter cannot reach it. */
/* The card carries its own background. It used to put white on nothing and rely on the
 * gblur+eq of compose.py — but a blur does not darken. Measured over a white screen the
 * text came out at 1.5:1, and 1.8:1 over the wp-admin grey, against a 3:1 floor. It never
 * showed on a dark UI; it would have broken on the first WordPress capture. 14.6:1 now.
 * Never let legibility depend on a filter applied to content we do not control. */
.card { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 40px;
        background: var(--overlay-strong-bg); }
.number { font-size: 210px; font-weight: 200; color: var(--fg); line-height: 1;
          letter-spacing: -.02em; }
.label { font-size: 76px; font-weight: 300; color: var(--fg); text-align: center;
         max-width: 1300px; line-height: 1.15; }
.rule { width: 180px; height: 8px; background: var(--rule); }
</style>
<div class="card">
  <div class="number">$number</div>
  <div class="rule"></div>
  <div class="label">$label</div>
</div>
