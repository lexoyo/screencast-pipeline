<!doctype html><meta charset="utf-8">
<style>$theme</style>
<style>$base</style>
<style>
/* A chapter overlay confirms what is being said out loud — it does not narrate. Hence a
 * single line, low in frame, readable in one glance and gone in three seconds. A list of
 * bullet points here would sit on the picture long enough to hide what is being shown. */
.bar {
  position: absolute; left: 0; right: 0; bottom: 108px;
  padding: 40px 130px;
  background: var(--overlay-bg);
  border-left: 14px solid var(--rule);
}
.number { font-size: 34px; font-weight: 700; letter-spacing: .18em; color: var(--muted); }
.title  { font-size: 66px; font-weight: 600; color: var(--fg); margin-top: 14px; line-height: 1.08; }
</style>
<div class="bar">
  <div class="number">$number</div>
  <div class="title">$title</div>
</div>
