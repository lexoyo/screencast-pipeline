[project]
name = "screencast"
version = "0.1.0"
description = "A harness that turns an OBS screencast into a publishable video"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# NO RUNTIME DEPENDENCIES, ON PURPOSE.
# This has to still work in two years on a freshly reinstalled machine. Everything it
# needs is either the Python standard library or an external binary it drives (ffmpeg,
# whisper-cli, claude, melt-7, sonorita-cli) — all checked by `./screencast doctor`.
# Every pip dependency is one more thing that can break on the day of a shoot. Don't.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]
ignore = ["E501"]  # ffmpeg filtergraphs are unreadable once wrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
